name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          function rewriteAssets(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const filePath = path.join(directory, entry.name)
              if (entry.isDirectory()) {
                rewriteAssets(filePath)
              } else if (/\.(html|js|css)$/.test(entry.name)) {
                let content = fs.readFileSync(filePath, 'utf8')
                content = content.replace(/(["'`])\/(assets|images|fonts)\//g, '$1/lesoleildubrusq2/$2/')
                content = content.replace(/(["'`])\/favicon\.png/g, '$1/lesoleildubrusq2/favicon.png')
                content = content.replace(/url\(\/fonts\//g, 'url(/lesoleildubrusq2/fonts/')
                fs.writeFileSync(filePath, content)
              }
            }
          }

          rewriteAssets('dist')
          NODE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4